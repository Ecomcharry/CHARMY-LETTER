<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Charmy Letter</title>

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      min-height:100vh;
      overflow:hidden;
      font-family:'Montserrat', sans-serif;
      background:black;
    }

    .hero{
      width:100%;
      min-height:100vh;

      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;

      overflow:hidden;
    }

    /* VÍDEO */

    .bg-video{
      position:absolute;
      top:0;
      left:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:0;
    }

    /* IMAGEM IPHONE */

    .iphone-image{
      position:absolute;
      top:0;
      left:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:0;

      display:none;
    }

    /* OVERLAY */

    .hero::before{
      content:'';

      position:absolute;
      inset:0;

      background:rgba(0,0,0,0.55);

      z-index:1;
    }

    /* CONTEÚDO */

    .content{
      position:relative;
      z-index:2;

      text-align:center;

      color:white;

      max-width:650px;

      padding:20px;
    }

    h1{
      font-family:'Pinyon Script', cursive;

      font-size:100px;
      font-weight:400;

      line-height:1;

      white-space:nowrap;
    }

    p{
      margin-top:20px;

      font-size:16px;
      font-weight:300;

      line-height:1.7;

      opacity:0.95;
    }

    /* BOTÃO */

    .site-button{

      display:inline-flex;
      align-items:center;
      justify-content:center;

      margin-top:35px;

      width:220px;
      height:56px;

      background:#f3e2cf;

      color:black;

      text-decoration:none;

      border-radius:50px;

      font-size:13px;
      font-weight:600;

      letter-spacing:3px;

      transition:0.3s;

    }

    .site-button:hover{
      transform:translateY(-3px);
      background:white;
    }

    /* RESPONSIVO */

    @media(max-width:768px){

      body{
        overflow:auto;
      }

      .hero{
        padding:40px 20px;
      }

      h1{
        font-size:52px;

        white-space:nowrap;
      }

      p{
        font-size:15px;
        line-height:1.6;
      }

      .site-button{
        width:100%;
        max-width:240px;

        height:52px;

        font-size:12px;
      }

    }

  </style>

</head>

<body>

  <section class="hero">

    <!-- VÍDEO -->
    <video
      id="mainVideo"
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="charry.mp4" type="video/mp4">
    </video>

    <!-- IMAGEM ESTÁTICA -->
    <img
      src="estatico.jpg"
      class="iphone-image"
      id="iphoneImage"
    />

    <div class="content">

      <h1>Charmy Letter</h1>

      <p>
        Obrigada por participar ✨<br><br>

        Em alguns minutos, a sua dica de presente será enviada para o seu amor.<br>
        Agora é só esperar… ele vai amar essa surpresa 🤍
      </p>

      <a
        href="https://www.charry.com.br/collections/inverno-26"
        class="site-button"
        target="_blank"
      >
        ACESSE O SITE
      </a>

    </div>

  </section>

  <script>

    // DETECTA IPHONE/IPAD

    const isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if(isiPhone){

      document.getElementById("mainVideo").style.display = "none";

      document.getElementById("iphoneImage").style.display = "block";

    }

  </script>

</body>

</html>
