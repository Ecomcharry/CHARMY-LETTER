<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Charmy Letter</title>

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
      overflow:hidden;
      background:black;
    }

    /* HERO */

    .hero{
      width:100%;
      min-height:100vh;

      position:relative;
      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;
    }

    /* VÍDEO / IMAGEM */

    .bg-video,
    .iphone-image{

      position:absolute;
      top:0;
      left:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:0;
    }

    /* IMAGEM IPHONE ESCONDIDA */

    .iphone-image{
      display:none;
    }

    /* OVERLAY */

    .hero::before{
      content:'';

      position:absolute;
      inset:0;

      background:rgba(0,0,0,0.50);

      z-index:1;
    }

    /* CONTEÚDO */

    .content{
      position:relative;
      z-index:2;

      width:100%;
      max-width:520px;

      color:white;

      text-align:center;
    }

    h1{
      font-family:'Pinyon Script', cursive;

      font-size:105px;
      font-weight:400;

      line-height:1;

      white-space:nowrap;
    }

    .subtitle{
      margin-top:22px;

      font-size:18px;
      font-weight:300;

      line-height:1.7;

      color:rgba(255,255,255,0.95);
    }

    form{
      margin-top:42px;

      display:flex;
      flex-direction:column;

      gap:18px;
    }

    .input-group{
      display:flex;
      flex-direction:column;

      text-align:left;
    }

    .input-group label{
      margin-bottom:10px;

      font-size:13px;
      font-weight:500;

      letter-spacing:3px;

      color:#f3e2cf;
    }

    input{
      width:100%;

      height:64px;

      padding:0 24px;

      border-radius:22px;

      border:1px solid rgba(255,255,255,0.35);

      background:rgba(255,255,255,0.06);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      color:white;

      font-size:16px;

      outline:none;

      transition:0.3s;
    }

    input::placeholder{
      color:rgba(255,255,255,0.6);
    }

    input:focus{
      border:1px solid #f3e2cf;
      background:rgba(255,255,255,0.1);
    }

    button{
      margin-top:8px;

      width:190px;
      height:54px;

      border:none;

      border-radius:50px;

      background:#f3e2cf;

      color:black;

      font-size:13px;
      font-weight:600;

      letter-spacing:4px;

      cursor:pointer;

      transition:0.3s;

      align-self:center;
    }

    button:hover{
      transform:translateY(-2px);
    }

    /* RESPONSIVO */

    @media(max-width:768px){

      body{
        overflow:auto;
      }

      .hero{
        padding:30px 20px;
      }

      h1{
        font-size:52px;

        white-space:nowrap;
      }

      .subtitle{
        font-size:16px;
      }

      input{
        height:58px;
        font-size:15px;
      }

      button{
        width:100%;
        max-width:220px;

        height:52px;
      }

    }

  </style>

</head>

<body>

  <section class="hero">

    <!-- VÍDEO -->
    <video
      id="mainVideo"
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="charry.mp4" type="video/mp4">
    </video>

    <!-- IMAGEM IPHONE -->
    <img
      src="estatico.jpg"
      class="iphone-image"
      id="iphoneImage"
    />

    <div class="content">

      <h1>Charmy Letter</h1>

      <p class="subtitle">
        Você escolhe o look dos sonhos…<br>
        e o seu amor recebe o recado
      </p>

      <form action="looks.html">

        <div class="input-group">

          <label>SEU E-MAIL</label>

          <input
            type="email"
            placeholder="Digite seu e-mail"
            required
          >

        </div>

        <div class="input-group">

          <label>SEU TELEFONE</label>

          <input
            type="tel"
            placeholder="(00) 00000-0000"
            required
          >

        </div>

        <button type="submit">
          CONTINUAR
        </button>

      </form>

    </div>

  </section>

  <script>

    // DETECTA IPHONE

    const isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if(isiPhone){

      document.getElementById("mainVideo").style.display = "none";

      document.getElementById("iphoneImage").style.display = "block";

    }

  </script>

</body>

</html>
