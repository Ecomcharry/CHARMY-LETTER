<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Charmy Letter</title>

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      font-family:'Montserrat', sans-serif;
    }

    .hero{
      width:100%;
      min-height:100vh;

      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:40px 20px;
    }

    /* VÍDEO DE FUNDO */

    .hero video{
      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:100%;

      object-fit:cover;
    }

    /* OVERLAY ESCURO */

    .hero::before{
      content:'';

      position:absolute;
      inset:0;

      background:rgba(0,0,0,0.55);

      z-index:1;
    }

    .content{
      position:relative;
      z-index:2;

      width:100%;
      max-width:700px;

      text-align:center;

      color:white;

      padding:20px;
    }

    h1{
      font-family:'Pinyon Script', cursive;

      font-size:100px;
      font-weight:400;

      line-height:1.1;

      white-space:nowrap;
    }

    p{
      margin-top:20px;

      font-size:16px;
      font-weight:300;

      line-height:1.8;

      opacity:0.95;
    }

    /* BOTÕES */

    .buttons{
      margin-top:35px;

      display:flex;
      gap:14px;

      justify-content:center;

      flex-wrap:wrap;
    }

    .site-button{

      display:inline-flex;
      align-items:center;
      justify-content:center;

      width:220px;
      height:56px;

      background:#f3e2cf;

      color:black;

      text-decoration:none;

      border:none;

      border-radius:50px;

      font-size:13px;
      font-weight:600;

      letter-spacing:3px;

      cursor:pointer;

      transition:0.3s;
    }

    .site-button:hover{
      transform:translateY(-3px);

      background:white;
    }

    /* BOTÃO VOLTAR */

    .restart-button{
      background:transparent;

      border:1px solid rgba(255,255,255,0.4);

      color:white;
    }

    .restart-button:hover{
      background:rgba(255,255,255,0.1);
    }

    /* ========================= */
    /* TABLET */
    /* ========================= */

    @media(max-width:1024px){

      h1{
        font-size:82px;
      }

      p{
        font-size:15px;
      }

    }

    /* ========================= */
    /* MOBILE */
    /* ========================= */

    @media(max-width:768px){

      .hero{
        padding:30px 18px;
      }

      .content{
        max-width:100%;
        padding:10px;
      }

      h1{
        font-size:64px;

        white-space:nowrap;

        line-height:1;
      }

      p{
        font-size:15px;

        line-height:1.7;
      }

      .site-button{
        width:190px;
        height:52px;

        font-size:12px;

        letter-spacing:2px;
      }

    }

    /* ========================= */
    /* CELULAR PEQUENO */
    /* ========================= */

    @media(max-width:480px){

      .hero{
        padding:25px 16px;
      }

      h1{
        font-size:52px;
      }

      p{
        font-size:14px;

        line-height:1.6;
      }

      .buttons{
        margin-top:28px;
      }

      .site-button{
        width:100%;
        max-width:220px;

        height:50px;

        font-size:11px;

        letter-spacing:2px;
      }

    }

  </style>

</head>

<body>

  <section class="hero">

    <!-- VÍDEO DE FUNDO -->

    <video autoplay muted loop playsinline>
      <source src="./charyleter.mp4" type="video/mp4">
    </video>

    <div class="content">

      <h1>Charmy Letter</h1>

      <p>
        Obrigada por participar <br><br>

        Em alguns minutos, a sua dica de presente será enviada para o seu amor.<br>
        Agora é só esperar… ele vai amar essa surpresa 🤍
      </p>

      <!-- BOTÕES -->

      <div class="buttons">

        <!-- BOTÃO SITE -->

        <a 
          href="https://www.charry.com.br/collections/the-most-loved-edit"
          class="site-button"
          target="_blank"
        >
          ACESSE O SITE
        </a>

        <!-- BOTÃO RECOMEÇAR -->

        <button 
          class="site-button restart-button"
          onclick="restartExperience()"
        >
          ESCOLHER NOVAMENTE
        </button>

      </div>

    </div>

  </section>

  <script>

    function restartExperience(){

      // LIMPA TODOS OS DADOS SALVOS

      localStorage.clear();

      // VOLTA PARA A PRIMEIRA PÁGINA

      window.location.href = "index.html";
    }

  </script>

</body>

</html>
