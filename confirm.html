<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmar escolha</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      overflow-x:hidden;
    }

    body{
      background:#5a0f1b;

      font-family:Arial, sans-serif;

      color:white;

      display:flex;
      justify-content:center;

      padding:50px 20px;
    }

    .container{
      width:100%;
      max-width:520px;
    }

    h1{
      font-size:32px;

      margin-bottom:10px;

      line-height:1.2;
    }

    .subtitle{
      opacity:0.85;

      margin-bottom:30px;

      font-size:15px;

      line-height:1.6;
    }

    .card{
      background:rgba(255,255,255,0.06);

      padding:18px;

      border-radius:18px;

      margin-bottom:28px;
    }

    #productName{
      font-size:15px;

      line-height:1.5;
    }

    form{
      width:100%;
    }

    label{
      display:block;

      margin:16px 0 8px;

      font-size:13px;

      line-height:1.4;
    }

    input,
    select,
    textarea{
      width:100%;

      padding:14px 16px;

      border-radius:14px;

      border:none;

      outline:none;

      font-size:14px;

      font-family:Arial;

      background:white;

      color:black;
    }

    textarea{
      min-height:150px;

      resize:none;

      line-height:1.6;
    }

    button{
      width:100%;

      margin-top:28px;

      padding:16px;

      border:none;

      border-radius:40px;

      background:white;

      color:#5a0f1b;

      font-weight:bold;

      font-size:14px;

      letter-spacing:1px;

      cursor:pointer;

      transition:0.3s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    /* ========================= */
    /* TABLET */
    /* ========================= */

    @media(max-width:768px){

      body{
        padding:35px 18px;
      }

      .container{
        max-width:100%;
      }

      h1{
        font-size:28px;
      }

      .subtitle{
        font-size:14px;
      }

      input,
      select,
      textarea{
        font-size:16px;
      }

      textarea{
        min-height:140px;
      }

      button{
        padding:15px;
      }

    }

    /* ========================= */
    /* MOBILE */
    /* ========================= */

    @media(max-width:480px){

      body{
        padding:28px 14px;
      }

      h1{
        font-size:24px;

        line-height:1.3;
      }

      .subtitle{
        font-size:13px;

        line-height:1.5;
      }

      .card{
        padding:16px;
      }

      #productName{
        font-size:14px;
      }

      label{
        font-size:12px;
      }

      input,
      select,
      textarea{
        padding:13px 14px;

        font-size:15px;

        border-radius:12px;
      }

      textarea{
        min-height:130px;
      }

      button{
        margin-top:24px;

        padding:14px;

        font-size:13px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Gostou do produto?</h1>

    <p class="subtitle">
      A gente envia sua dica de presente para o seu amor ✨
    </p>

    <div class="card">
      <p id="productName"></p>
    </div>

    <form onsubmit="sendForm(event)">

      <label>Seu nome</label>
      <input id="name" required>

      <label>Seu e-mail</label>
      <input id="email" type="email" required>

      <label>Seu telefone</label>
      <input id="phone" required>

      <label>Selecione seu tamanho</label>

      <select id="size" required>
        <option value="">Selecione</option>
        <option>PP</option>
        <option>P</option>
        <option>M</option>
        <option>G</option>
        <option>GG</option>
      </select>

      <label>Telefone de quem vai presentear</label>
      <input id="loverPhone" required>

      <label>Mensagem para o seu amor</label>

      <textarea id="message"></textarea>

      <button type="submit">
        ENVIAR DICA
      </button>

    </form>

  </div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyhwUF5WdUPhb5dM0cOmrzGjiGvmEJVxzDwfDpyAnKu0b1Z8zM4PkSMZwviYjaNfPEw/exec";

const name = localStorage.getItem("selectedLook");
const link = localStorage.getItem("selectedLink");

document.getElementById("productName").innerText =
  name || "";

const autoMessage = `
Oii!

Seu amor decidiu nos contar qual presente gostaria de ganhar nesse dia dos namorados e a gente veio facilitar sua vida ✨

Ela já escolheu o look perfeito pra esse momento especial e aqui está o link direto para você acertar em cheio:

${name}
${link}

Qualquer dúvida, estamos por aqui 🤍
`;

document.getElementById("message").value = autoMessage;

async function sendForm(e){

  e.preventDefault();

  const data = {

    name: document.getElementById("name").value,

    email: document.getElementById("email").value,

    phone: document.getElementById("phone").value,

    size: document.getElementById("size").value,

    loverPhone: document.getElementById("loverPhone").value,

    product: name,

    link: link
  };

  try {

    const response = await fetch(SCRIPT_URL, {

      method: "POST",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify(data)

    });

    const result = await response.text();

    console.log(result);

    window.location.href = "final.html";

  } catch(err){

    console.log(err);

    alert("Erro ao enviar formulário");
  }
}

</script>
