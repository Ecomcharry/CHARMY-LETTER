<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escolha seu look</title>

  <style>

    body{
      margin:0;
      background:#5a0f1b;
      font-family:Arial;
      color:white;
    }

    .container{
      padding:50px 20px;
      max-width:1100px;
      margin:auto;
      text-align:center;
    }

    h1{
      font-size:34px;
      margin-bottom:10px;
      color:white;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
      transition:0.3s;
      text-align:left;
    }

    .card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.12);
    }

    .card img{
      width:100%;
      height:280px;
      object-fit:cover;
      display:block;
      background:#222;
    }

    .info{
      padding:15px;
    }

    .info h3{
      margin:0;
      font-size:16px;
      color:white;
    }

    .error{
      margin-top:20px;
      color:white;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Escolha seu look favorito para receber como presente!</h1>

    <div class="grid" id="product-grid"></div>

    <div class="error" id="error"></div>

  </div>

<script>

const API_URL = "https://use-charry.myshopify.com/api/2023-10/graphql.json";
const TOKEN = "eaac1cfd8130a60c0be145a3a65684e6";

let allProducts = [];

async function fetchProducts(cursor = null) {

  const query = `
  {
    collection(handle: "inverno-26") {
      products(first: 50${cursor ? `, after: "${cursor}"` : ""}) {
        pageInfo {
          hasNextPage
        }
        edges {
          cursor
          node {
            title
            handle
            images(first: 1) {
              edges {
                node {
                  url
                }
              }
            }
          }
        }
      }
    }
  }`;

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Shopify-Storefront-Access-Token": TOKEN
    },
    body: JSON.stringify({ query })
  });

  const data = await res.json();

  const productsData = data?.data?.collection?.products;

  const edges = productsData?.edges || [];

  allProducts = allProducts.concat(edges);

  const hasNext = productsData?.pageInfo?.hasNextPage;

  if (hasNext) {
    const lastCursor = edges[edges.length - 1].cursor;
    return fetchProducts(lastCursor);
  }

  return allProducts;
}

function render(products) {

  const grid = document.getElementById("product-grid");

  products.forEach((item) => {

    const p = item.node;

    const title = p?.title || "";
    const handle = p?.handle || "";
    const img = p?.images?.edges?.[0]?.node?.url || "";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${img}" />
      <div class="info">
        <h3>${title}</h3>
      </div>
    `;

    card.onclick = () => {

      localStorage.setItem("selectedLook", title);
      localStorage.setItem("selectedImage", img);
      localStorage.setItem("selectedLink", `https://www.charry.com.br/products/${handle}`);

      window.location.href = "confirm.html";
    };

    grid.appendChild(card);
  });
}

async function init() {

  try {

    const products = await fetchProducts();
    render(products);

  } catch (err) {

    console.log(err);

    document.getElementById("error").innerHTML =
      "Erro ao carregar produtos da Shopify.";
  }
}

init();

</script>

</body>
</html>
