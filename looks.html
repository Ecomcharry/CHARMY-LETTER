<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escolha seu look</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      overflow-x:hidden;
    }

    body{
      background:#5a0f1b;
      font-family:Arial, sans-serif;
      color:white;
    }

    .container{
      width:100%;
      max-width:1400px;
      margin:auto;
      padding:60px 40px;
    }

    h1{
      font-size:34px;
      margin-bottom:10px;
      color:white;
      text-align:center;
      line-height:1.2;
    }

    .subtitle{
      opacity:0.8;
      margin-bottom:40px;
      font-size:14px;
      text-align:center;
      line-height:1.6;
    }

    /* GRID */

    .grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:50px 35px;
      margin-top:40px;
    }

    /* CARD */

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);

      border-radius:0 !important;

      overflow:hidden;

      cursor:pointer;

      transition:0.3s;

      text-align:left;
    }

    /* REMOVE QUALQUER ARREDONDAMENTO */

    .card *{
      border-radius:0 !important;
    }

    .card:hover{
      transform:translateY(-6px);
      background:rgba(255,255,255,0.12);
    }

    /* IMAGEM */

    .card img{
      width:100%;
      height:auto;
      object-fit:contain;
      display:block;
      background:#222;
      border-radius:0 !important;
    }

    .info{
      padding:16px;
    }

    .info h3{
      margin:0;
      font-size:15px;
      color:white;
      font-weight:400;
      line-height:1.4;
    }

    .error{
      margin-top:20px;
      color:white;
      font-size:14px;
      text-align:center;
    }

    /* ============================= */
    /* TABLET */
    /* ============================= */

    @media(max-width:1024px){

      .container{
        padding:50px 30px;
      }

      .grid{
        grid-template-columns:repeat(3, 1fr);
        gap:35px 25px;
      }

      h1{
        font-size:30px;
      }

    }

    /* ============================= */
    /* MOBILE */
    /* ============================= */

    @media(max-width:768px){

      .container{
        padding:40px 20px;
      }

      h1{
        font-size:26px;
        line-height:1.3;
      }

      .subtitle{
        font-size:14px;
        margin-bottom:30px;
      }

      .grid{
        grid-template-columns:repeat(2, 1fr);
        gap:25px 18px;
      }

      .info{
        padding:12px;
      }

      .info h3{
        font-size:13px;
      }

    }

    /* ============================= */
    /* CELULAR PEQUENO */
    /* ============================= */

    @media(max-width:480px){

      .container{
        padding:30px 14px;
      }

      h1{
        font-size:22px;
      }

      .subtitle{
        font-size:13px;
        line-height:1.5;
      }

      .grid{
        grid-template-columns:1fr 1fr;
        gap:20px 14px;
      }

      .info{
        padding:10px;
      }

      .info h3{
        font-size:12px;
        line-height:1.4;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Escolha seu look favorito para receber como presente!</h1>

    <p class="subtitle">
      Clique no look que mais combina com você
    </p>

    <div class="grid" id="product-grid"></div>

    <div class="error" id="error"></div>

  </div>

<script>

const API_URL = "https://use-charry.myshopify.com/api/2023-10/graphql.json";

const TOKEN = "eaac1cfd8130a60c0be145a3a65684e6";

let allProducts = [];

async function fetchProducts(cursor = null) {

  const query = `
  {
    collection(handle: "inverno-26") {

      products(first: 50${cursor ? `, after: "${cursor}"` : ""}) {

        pageInfo {
          hasNextPage
        }

        edges {

          cursor

          node {

            title

            handle

            images(first: 1) {

              edges {

                node {
                  url
                }

              }

            }

          }

        }

      }

    }
  }`;

  const res = await fetch(API_URL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "X-Shopify-Storefront-Access-Token": TOKEN
    },

    body: JSON.stringify({ query })

  });

  const data = await res.json();

  const productsData = data?.data?.collection?.products;

  const edges = productsData?.edges || [];

  allProducts = allProducts.concat(edges);

  const hasNext = productsData?.pageInfo?.hasNextPage;

  if (hasNext) {

    const lastCursor = edges[edges.length - 1].cursor;

    return fetchProducts(lastCursor);
  }

  return allProducts;
}

function render(products) {

  const grid = document.getElementById("product-grid");

  products.forEach((item) => {

    const p = item.node;

    const title = p?.title || "";

    const handle = p?.handle || "";

    const img = p?.images?.edges?.[0]?.node?.url || "";

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img src="${img}" alt="${title}" />

      <div class="info">
        <h3>${title}</h3>
      </div>
    `;

    card.onclick = () => {

      localStorage.setItem("selectedLook", title);

      localStorage.setItem("selectedImage", img);

      localStorage.setItem(
        "selectedLink",
        `https://www.charry.com.br/products/${handle}`
      );

      window.location.href = "confirm.html";
    };

    grid.appendChild(card);

  });

}

async function init() {

  try {

    const products = await fetchProducts();

    render(products);

  } catch (err) {

    console.log(err);

    document.getElementById("error").innerHTML =
      "Erro ao carregar produtos da Shopify.";
  }

}

init();

</script>
